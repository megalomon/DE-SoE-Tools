[workspace]
resolver = "2"
members = [
    "crates/soe-core",
    "crates/soe-script",
    "crates/soe-dumper",
    "crates/everscript",
    "crates/soe-tiles",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["DE-SoE-Tools Contributors"]
license = "MIT OR Apache-2.0"

[workspace.dependencies]
soe-core = { path = "crates/soe-core" }
soe-script = { path = "crates/soe-script" }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
byteorder = "1.5"
